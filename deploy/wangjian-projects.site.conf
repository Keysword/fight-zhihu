server {
    server_name projects.wangjian7410.cc;

    root /srv/wangjian-projects/site;
    index index.html;
    charset utf-8;
    autoindex off;

    access_log /var/log/nginx/wangjian-projects.access.log;
    error_log /var/log/nginx/wangjian-projects.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/snippets/background-board.conf;

    location ~ /\. {
        deny all;
    }

    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/projects.wangjian7410.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projects.wangjian7410.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = projects.wangjian7410.cc) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name projects.wangjian7410.cc;
    return 404;
}
