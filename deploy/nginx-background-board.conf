location = /background-board {
    return 308 /background-board/;
}

location /background-board/ {
    proxy_pass http://127.0.0.1:3210;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # This server is the only trusted reverse proxy. Overwrite any client-supplied
    # forwarding chain so application rate limits cannot be bypassed by spoofing it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    client_max_body_size 2m;
    proxy_connect_timeout 10s;
    # An agent run can legitimately span several model turns, and both a
    # safety-repair turn and the automatic fact downgrade add round trips on
    # top. One observed run reached 181s, so 180s still cut it off as a 504.
    # 300s is a safety net, not a target: the real fix is fewer turns.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
