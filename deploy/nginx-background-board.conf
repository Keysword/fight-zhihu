location = /background-board {
    return 308 /background-board/;
}

location /background-board/ {
    proxy_pass http://127.0.0.1:3210;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # This server is the only trusted reverse proxy. Overwrite any client-supplied
    # forwarding chain so application rate limits cannot be bypassed by spoofing it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    client_max_body_size 2m;
    proxy_connect_timeout 10s;
    # Agent runs can legitimately need several model turns, and a safety-repair
    # turn adds another round trip on top of the initial response. A single
    # observed run already took ~92s, so 90s cut the repair cycle off as a 504.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}
